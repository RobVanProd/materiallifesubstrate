name: Bounded Fractional Phase-State Lab

on:
  push:
    branches:
      - bounded-fractional-phase-state-lab
    tags:
      - bounded-fractional-phase-state-lab-evidence-*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp:
    name: C++ / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - label: Linux Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - label: Windows MSVC
            os: windows-latest
            cc: ""
            cxx: ""
    steps:
      - name: Check out tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Configure, build, and test on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          {
            git rev-parse HEAD
            cmake --version
            ninja --version
            "$CXX" --version
            python3 --version
          } 2>&1 | tee ci-artifacts/tool-versions.txt
          cmake --preset dev 2>&1 | tee ci-artifacts/configure.txt
          cmake --build --preset dev --parallel 2 2>&1 | tee ci-artifacts/build.txt
          ctest --preset dev --output-on-failure -R '^mls\.validation$' \
            2>&1 | tee ci-artifacts/ctest.txt
      - name: Configure, build, and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-artifacts | Out-Null
          git rev-parse HEAD | Tee-Object ci-artifacts/tool-versions.txt
          cmake --version 2>&1 | Tee-Object ci-artifacts/tool-versions.txt -Append
          ninja --version 2>&1 | Tee-Object ci-artifacts/tool-versions.txt -Append
          python --version 2>&1 | Tee-Object ci-artifacts/tool-versions.txt -Append
          cmd /c "cl /? 2>&1" | Tee-Object ci-artifacts/tool-versions.txt -Append
          cmake --preset dev 2>&1 | Tee-Object ci-artifacts/configure.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset dev --parallel 2 2>&1 | Tee-Object ci-artifacts/build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --preset dev --output-on-failure -R '^mls\.validation$' `
            2>&1 | Tee-Object ci-artifacts/ctest.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bounded-phase-cpp-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: ignore
          retention-days: 30

  oracle:
    # Keep the repository's protected-branch context stable while the step and
    # artifact names below retain this lab's more specific description.
    name: Python exact oracle
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Reproduce parent, twins, oracle, and mutations
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts build/bounded-fractional-ci
          python --version 2>&1 | tee ci-artifacts/python-version.txt
          python -m pip install --requirement requirements-bounded-fractional-phase-state.txt \
            2>&1 | tee ci-artifacts/python-dependencies.txt
          python tests/bounded_fractional_phase_state_algorithm_test.py \
            2>&1 | tee ci-artifacts/algorithm-contracts.txt

          parent_archive=build/bounded-fractional-ci/parent.tar.gz
          curl --fail --location --show-error \
            https://github.com/RobVanProd/materiallifesubstrate/releases/download/explicit-fractional-phase-state-lab-evidence-v1/explicit-fractional-phase-state-evidence-v1.tar.gz \
            --output "$parent_archive"
          echo "77aad47e1842b4fe29760594ee247f609b5d1e88ae7e6b370d86c0bdbb6c71de  $parent_archive" \
            | sha256sum --check --strict | tee ci-artifacts/parent-archive.txt
          tar -xzf "$parent_archive" -C build/bounded-fractional-ci
          parent_bundle=build/bounded-fractional-ci/explicit-fractional-phase-state-evidence-v1
          parent_raw="$parent_bundle/raw-a"
          python tools/seal_explicit_fractional_phase_state_evidence.py verify \
            --bundle "$parent_bundle" 2>&1 | tee ci-artifacts/parent-outer-seal.txt

          raw_a=build/bounded-fractional-ci/raw-a
          raw_b=build/bounded-fractional-ci/raw-b
          set +e
          python tools/run_bounded_fractional_phase_state_lab.py \
            --parent-raw "$parent_raw" --output "$raw_a" --source . \
            > ci-artifacts/raw-a.txt 2>&1 &
          pid_a=$!
          python tools/run_bounded_fractional_phase_state_lab.py \
            --parent-raw "$parent_raw" --output "$raw_b" --source . \
            > ci-artifacts/raw-b.txt 2>&1 &
          pid_b=$!
          wait "$pid_a"; status_a=$?
          wait "$pid_b"; status_b=$?
          set -e
          cat ci-artifacts/raw-a.txt
          cat ci-artifacts/raw-b.txt
          test "$status_a" -eq 0
          test "$status_b" -eq 0
          python tests/compare_evidence_directories.py --first "$raw_a" --second "$raw_b" \
            2>&1 | tee ci-artifacts/raw-twin.txt
          python reference/bounded_fractional_phase_state_oracle.py \
            --raw "$raw_a" --parent-raw "$parent_raw" \
            --output ci-artifacts/oracle-summary.json \
            2>&1 | tee ci-artifacts/oracle.txt
          python tests/bounded_fractional_phase_state_oracle_test.py \
            --raw "$raw_a" --parent-raw "$parent_raw" \
            2>&1 | tee ci-artifacts/oracle-mutations.txt
          python tests/bounded_fractional_phase_state_seal_test.py \
            2>&1 | tee ci-artifacts/seal-mutations.txt
          python reference/validate_bounded_fractional_phase_state_bundle.py --help \
            > ci-artifacts/bundle-validator-help.txt
          python tools/seal_bounded_fractional_phase_state_evidence.py --help \
            > ci-artifacts/seal-tool-help.txt
      - name: Preserve oracle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bounded-phase-oracle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: ignore
          retention-days: 30

  lean:
    name: Pinned Lean build and axiom output
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ELAN_VERSION: v4.2.4
      ELAN_ARCHIVE_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
    steps:
      - name: Check out tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Elan
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/elan.tar.gz"
          directory="$RUNNER_TEMP/elan-installer"
          curl --fail --location --show-error \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          echo "${ELAN_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$directory"
          tar -xzf "$archive" -C "$directory"
          "$directory/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build proofs and report trust boundary
        shell: bash
        working-directory: formal
        run: |
          set -euo pipefail
          mkdir -p ../ci-artifacts
          lake --wfail build 2>&1 | tee ../ci-artifacts/lean-build.txt
          lake env lean MLSFormal/AxiomReport.lean \
            2>&1 | tee ../ci-artifacts/lean-axioms.txt
          python ../tools/formal_trust_scan.py --formal-root . \
            2>&1 | tee ../ci-artifacts/lean-trust.txt
      - name: Preserve formal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bounded-phase-lean-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: ignore
          retention-days: 30
