name: Authoritative Drift State Bridge Lab

on:
  push:
    branches:
      - authoritative-drift-state-bridge-lab
    tags:
      - authoritative-drift-state-bridge-lab-evidence-*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp:
    name: C++ / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - label: Linux Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - label: Windows MSVC
            os: windows-latest
            cc: ""
            cxx: ""
    steps:
      - name: Check out tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Configure, build, and test on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          {
            git rev-parse HEAD
            cmake --version
            ninja --version
            "$CXX" --version
          } 2>&1 | tee ci-artifacts/tool-versions.txt
          cmake --preset dev 2>&1 | tee ci-artifacts/configure.txt
          cmake --build --preset dev --parallel 2 2>&1 | tee ci-artifacts/build.txt
          ctest --preset dev --output-on-failure 2>&1 | tee ci-artifacts/ctest.txt
      - name: Configure, build, and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-artifacts | Out-Null
          git rev-parse HEAD | Tee-Object ci-artifacts/tool-versions.txt
          cmake --version 2>&1 | Tee-Object ci-artifacts/tool-versions.txt -Append
          ninja --version 2>&1 | Tee-Object ci-artifacts/tool-versions.txt -Append
          cmd /c "cl /? 2>&1" | Tee-Object ci-artifacts/tool-versions.txt -Append
          cmake --preset dev 2>&1 | Tee-Object ci-artifacts/configure.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset dev --parallel 2 2>&1 | Tee-Object ci-artifacts/build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --preset dev --output-on-failure 2>&1 | Tee-Object ci-artifacts/ctest.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drift-bridge-cpp-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: ignore
          retention-days: 30

  oracle:
    name: Python exact oracle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Reproduce twins, oracle, and mutations
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts raw-a raw-b
          python --version 2>&1 | tee ci-artifacts/python-version.txt
          cmake --preset dev 2>&1 | tee ci-artifacts/configure.txt
          cmake --build --preset dev \
            --target mls_authoritative_drift_state_bridge_diagnostic \
            --parallel 2 2>&1 | tee ci-artifacts/build.txt
          ./build/dev/mls_authoritative_drift_state_bridge_diagnostic \
            --output raw-a 2>&1 | tee ci-artifacts/raw-a.txt
          ./build/dev/mls_authoritative_drift_state_bridge_diagnostic \
            --output raw-b 2>&1 | tee ci-artifacts/raw-b.txt
          python tests/compare_evidence_directories.py --first raw-a --second raw-b \
            2>&1 | tee ci-artifacts/raw-twin.txt
          python reference/authoritative_drift_state_bridge_oracle.py \
            --raw raw-a --output ci-artifacts/oracle-summary.json \
            2>&1 | tee ci-artifacts/oracle.txt
          python tests/authoritative_drift_state_bridge_oracle_test.py \
            --raw raw-a 2>&1 | tee ci-artifacts/oracle-mutations.txt
          python tests/authoritative_drift_state_bridge_seal_test.py \
            2>&1 | tee ci-artifacts/seal-mutations.txt
          python -m py_compile \
            reference/authoritative_drift_state_bridge_oracle.py \
            reference/validate_authoritative_drift_state_bridge_bundle.py \
            tests/authoritative_drift_state_bridge_oracle_test.py \
            tests/authoritative_drift_state_bridge_seal_test.py \
            tools/seal_authoritative_drift_state_bridge_evidence.py
      - name: Preserve oracle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drift-bridge-oracle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: ignore
          retention-days: 30

  lean:
    name: Pinned Lean build and axiom output
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ELAN_VERSION: v4.2.4
      ELAN_ARCHIVE_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
    steps:
      - name: Check out tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Elan
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/elan.tar.gz"
          directory="$RUNNER_TEMP/elan-installer"
          curl --fail --location --show-error \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          echo "${ELAN_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$directory"
          tar -xzf "$archive" -C "$directory"
          "$directory/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build proofs and report trust boundary
        shell: bash
        working-directory: formal
        run: |
          set -euo pipefail
          mkdir -p ../ci-artifacts
          lake --wfail build 2>&1 | tee ../ci-artifacts/lean-build.txt
          lake env lean MLSFormal/AxiomReport.lean \
            2>&1 | tee ../ci-artifacts/lean-axioms.txt
          python ../tools/formal_trust_scan.py --formal-root . \
            2>&1 | tee ../ci-artifacts/lean-trust.txt
      - name: Preserve formal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drift-bridge-lean-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: ignore
          retention-days: 30
